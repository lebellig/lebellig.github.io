<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260">
  <rect width="400" height="260" fill="#f4f4f4"/>

  <!-- Source domain grid (left) -->
  <g opacity="0.18">
    <rect x="32" y="40" width="138" height="180" fill="#161616"/>
  </g>
  <!-- Source grid cells -->
  <g stroke="#e0e0e0" stroke-width="1" fill="none">
    <rect x="32" y="40" width="46" height="60" fill="#c6c6c6"/>
    <rect x="78" y="40" width="46" height="60" fill="#a8a8a8"/>
    <rect x="124" y="40" width="46" height="60" fill="#8d8d8d"/>
    <rect x="32" y="100" width="46" height="60" fill="#8d8d8d"/>
    <rect x="78" y="100" width="46" height="60" fill="#6f6f6f"/>
    <rect x="124" y="100" width="46" height="60" fill="#525252"/>
    <rect x="32" y="160" width="46" height="60" fill="#6f6f6f"/>
    <rect x="78" y="160" width="46" height="60" fill="#525252"/>
    <rect x="124" y="160" width="46" height="60" fill="#393939"/>
  </g>
  <text x="101" y="232" font-family="IBM Plex Mono, monospace" font-size="10" fill="#525252" text-anchor="middle" letter-spacing="1">SOURCE</text>

  <!-- Flow arrows in the center -->
  <g stroke="#0f62fe" stroke-width="2.5" fill="none">
    <line x1="188" y1="100" x2="212" y2="100"/>
    <polygon points="212,96 220,100 212,104" fill="#0f62fe" stroke="none"/>
    <line x1="188" y1="130" x2="212" y2="130"/>
    <polygon points="212,126 220,130 212,134" fill="#0f62fe" stroke="none"/>
    <line x1="188" y1="160" x2="212" y2="160"/>
    <polygon points="212,156 220,160 212,164" fill="#0f62fe" stroke="none"/>
  </g>

  <!-- Target domain grid (right) -->
  <g stroke="#e0e0e0" stroke-width="1">
    <rect x="230" y="40" width="46" height="60" fill="#ddeeff"/>
    <rect x="276" y="40" width="46" height="60" fill="#a8c8f0"/>
    <rect x="322" y="40" width="46" height="60" fill="#6fa8dc"/>
    <rect x="230" y="100" width="46" height="60" fill="#6fa8dc"/>
    <rect x="276" y="100" width="46" height="60" fill="#4589ff"/>
    <rect x="322" y="100" width="46" height="60" fill="#0f62fe"/>
    <rect x="230" y="160" width="46" height="60" fill="#4589ff"/>
    <rect x="276" y="160" width="46" height="60" fill="#0f62fe"/>
    <rect x="322" y="160" width="46" height="60" fill="#0043ce"/>
  </g>
  <text x="299" y="232" font-family="IBM Plex Mono, monospace" font-size="10" fill="#0f62fe" text-anchor="middle" letter-spacing="1">TARGET</text>

  <!-- Outer border -->
  <rect x="0.5" y="0.5" width="399" height="259" fill="none" stroke="#e0e0e0" stroke-width="1"/>
</svg>
