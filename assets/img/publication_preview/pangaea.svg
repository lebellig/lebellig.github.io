<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260">
  <rect width="400" height="260" fill="#f4f4f4"/>

  <!-- Grid background — latitude/longitude -->
  <g stroke="#e0e0e0" stroke-width="0.75" fill="none">
    <!-- Verticals -->
    <line x1="50"  y1="30" x2="50"  y2="230"/>
    <line x1="100" y1="30" x2="100" y2="230"/>
    <line x1="150" y1="30" x2="150" y2="230"/>
    <line x1="200" y1="30" x2="200" y2="230"/>
    <line x1="250" y1="30" x2="250" y2="230"/>
    <line x1="300" y1="30" x2="300" y2="230"/>
    <line x1="350" y1="30" x2="350" y2="230"/>
    <!-- Horizontals -->
    <line x1="30" y1="60"  x2="370" y2="60"/>
    <line x1="30" y1="100" x2="370" y2="100"/>
    <line x1="30" y1="140" x2="370" y2="140"/>
    <line x1="30" y1="180" x2="370" y2="180"/>
    <line x1="30" y1="220" x2="370" y2="220"/>
  </g>

  <!-- Data points — coloured by region/modality -->
  <!-- Europe cluster -->
  <circle cx="175" cy="75"  r="5" fill="#0f62fe"/>
  <circle cx="195" cy="85"  r="4" fill="#0f62fe"/>
  <circle cx="185" cy="65"  r="5" fill="#0f62fe"/>
  <circle cx="165" cy="90"  r="4" fill="#4589ff"/>
  <!-- North America cluster -->
  <circle cx="90"  cy="90"  r="5" fill="#0f62fe"/>
  <circle cx="75"  cy="105" r="4" fill="#4589ff"/>
  <circle cx="105" cy="80"  r="5" fill="#0043ce"/>
  <!-- East Asia cluster -->
  <circle cx="310" cy="80"  r="5" fill="#0f62fe"/>
  <circle cx="325" cy="95"  r="4" fill="#4589ff"/>
  <circle cx="295" cy="95"  r="4" fill="#0f62fe"/>
  <!-- Africa cluster -->
  <circle cx="195" cy="145" r="5" fill="#6f6f6f"/>
  <circle cx="210" cy="160" r="4" fill="#8d8d8d"/>
  <circle cx="180" cy="158" r="5" fill="#525252"/>
  <!-- South America cluster -->
  <circle cx="110" cy="160" r="5" fill="#6f6f6f"/>
  <circle cx="95"  cy="175" r="4" fill="#8d8d8d"/>
  <!-- Australia -->
  <circle cx="315" cy="165" r="5" fill="#6f6f6f"/>
  <circle cx="330" cy="155" r="4" fill="#525252"/>
  <!-- Sparse/polar -->
  <circle cx="55"  cy="60"  r="3" fill="#c6c6c6"/>
  <circle cx="340" cy="55"  r="3" fill="#c6c6c6"/>
  <circle cx="60"  cy="210" r="3" fill="#c6c6c6"/>
  <circle cx="340" cy="210" r="3" fill="#c6c6c6"/>
  <circle cx="200" cy="215" r="3" fill="#c6c6c6"/>

  <!-- Benchmark bar — bottom right -->
  <rect x="300" y="180" width="12" height="40" fill="#0f62fe"/>
  <rect x="318" y="192" width="12" height="28" fill="#4589ff"/>
  <rect x="336" y="200" width="12" height="20" fill="#6f6f6f"/>

  <text x="200" y="248" font-family="IBM Plex Mono, monospace" font-size="10" fill="#525252" text-anchor="middle" letter-spacing="1">GLOBAL BENCHMARK</text>
  <rect x="0.5" y="0.5" width="399" height="259" fill="none" stroke="#e0e0e0" stroke-width="1"/>
</svg>
